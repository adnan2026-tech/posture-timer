<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1214">
<title>Motion Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="fonts/fonts.css" onerror="this.remove()">
<style>
/* Layout: phone-first single column (max 760px). Camera screens put the video stage first; analysis screens lead with a summary, then the ranked improvement list, then replay and detail. Single dark theme by design (shop-floor camera tool). */
:root{
  --bg:#0d1214; --panel:#161e21; --panel-2:#1d272a; --ink:#e7eeec; --muted:#93a3a3; --line:#2a3639;
  --accent:#4db2ab; --accent-ink:#071211;
  --ok:#3dbd83; --slow:#e3a332; --method:#d27fd9; --miss:#ff7b6b; --fast:#6aa2df; --ghost:#f2f5f4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap>*,.panel>*{min-width:0;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:12px 40px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{text-align:left;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1;cursor:pointer;background:none;border:0;padding:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.privacy{font-size:12px;color:var(--accent);font-weight:600;max-width:30ch;text-align:right}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.lead{color:var(--muted);margin:2px 0 0;max-width:62ch}
.note{font-size:12.5px;color:var(--muted);margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.btn{min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:58px;font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.05em;flex:1}
.btn.stop{background:var(--miss);border-color:var(--miss);color:#1b0805}
.btn.sm{min-height:38px;padding:4px 12px;font-size:13px}
.btn.danger{color:var(--miss)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;min-height:36px;text-align:left}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:var(--panel-2);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.step{background:var(--panel-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.step b{font-family:var(--f-display);font-size:28px;color:var(--accent);line-height:1}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .meta{color:var(--muted);font-size:13px}
.item-main{min-width:0;flex:1}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.factory{color:var(--accent);border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.stage{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:60vh;margin:0 auto}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.65)}
.pill.rec{color:#fff;background:rgba(200,40,30,.85)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:120px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px;background:rgba(13,18,20,.85)}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--slow)}
.player canvas{width:100%;aspect-ratio:4/3;background:#06090a;border-radius:10px;display:block}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pctl input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--accent);min-height:36px}
.pctl .time{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:11ch;text-align:right}
.tl{position:relative;height:42px;border-radius:8px;background:var(--panel-2);overflow:hidden;cursor:pointer;touch-action:manipulation}
.tl .blk{position:absolute;top:0;bottom:0;border-right:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#071211;font-weight:500;overflow:hidden}
.tl .out{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.55),rgba(0,0,0,.55) 4px,rgba(0,0,0,.35) 4px,rgba(0,0,0,.35) 8px)}
.tl .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;box-shadow:0 0 0 1px #000;pointer-events:none}
.tl .mk{position:absolute;top:0;width:2px;height:10px;background:var(--slow)}
.tl-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);font-weight:600}
td.r,th.r{text-align:right}
td.num,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--panel-2)}
tr.click{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.imp{display:flex;flex-direction:column;gap:8px}
.imp-item{display:grid;grid-template-columns:4px 1fr auto;gap:4px 12px;padding:10px 12px 10px 0;background:var(--panel-2);border-radius:10px;cursor:pointer;border:0;text-align:left;width:100%}
.imp-item .sev{grid-row:1/3;background:var(--c);border-radius:10px 0 0 10px}
.imp-item .t{font-weight:600}
.imp-item .lost{font-family:var(--f-mono);font-size:13px;color:var(--c);text-align:right}
.imp-item .d{grid-column:2/4;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;background:var(--c);display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c),var(--c) 4px,transparent 4px,transparent 7px)}
.cur-el{font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;background:rgba(13,18,20,.85);display:flex;align-items:center;justify-content:center;z-index:30;font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.05em}
.check{display:flex;gap:10px;align-items:center;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);resize:vertical;line-height:1.4}
.kchip{min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:13px;cursor:pointer}
.kchip.on{background:var(--c);border-color:var(--c);color:#0b1011}
.jstep{gap:8px}
.jstep .ph{max-width:220px;border-radius:8px;display:block}
.savestate{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.userbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.uchip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;cursor:pointer}
.uchip i{font-style:normal;color:var(--muted);font-weight:500}
.menu{position:fixed;inset:0;z-index:40;background:rgba(5,8,9,.6);display:flex;align-items:flex-start;justify-content:flex-end;padding:calc(56px + env(safe-area-inset-top,0px)) 14px 14px}
.menu .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:230px;padding:6px;display:flex;flex-direction:column}
.menu .box button{background:none;border:0;text-align:left;padding:12px 14px;min-height:46px;border-radius:8px;font-weight:600;cursor:pointer}
.menu .box button:hover,.menu .box button:focus-visible{background:var(--panel-2)}
.menu .box .who{padding:10px 14px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:45;background:rgba(5,8,9,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.login{max-width:420px;margin:6vh auto 0;width:100%}
.role{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.role.admin{color:var(--accent);border-color:var(--accent)}
ul.tips{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" data-act="home">Motion Study<small>Motion standards · job breakdown · employee checks</small></button>
    <div class="userbar" id="userbar"><div class="privacy">Video stays on this phone. Only body-point coordinates are saved.</div></div>
  </div>
  <main id="app" class="wrap" style="padding:0;width:100%"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden>Analyzing…</div>
<div class="menu" id="menu" hidden></div>
<div class="modal" id="modal" hidden></div>

<script type="module">
// Inside the Android app everything loads from the phone; on the web it loads from the internet.
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
const CDN=NATIVE?new URL("mediapipe",location.href).href:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL=NATIVE?CDN+"/pose_landmarker_lite.task":"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const { PoseLandmarker, FilesetResolver } = await import(CDN+"/vision_bundle.mjs");

/*ENGINE-START*/
/* ===== Analysis engine (no DOM) ===== */
// Stored landmarks (MediaPipe ids): nose, shoulders, elbows, wrists, index fingers, hips, knees, ankles
const LM=[0,11,12,13,14,15,16,19,20,23,24,25,26,27,28];
const K={nose:0,ls:1,rs:2,le:3,re:4,lw:5,rw:6,li:7,ri:8,lh:9,rh:10,lk:11,rk:12,la:13,ra:14};
const SENS={strict:0.4,normal:0.5,lenient:0.65};
const CM_PER_UNIT=50; // body unit ≈ shoulder-to-hip length of an adult
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hyp=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// Turn stored frames into body-relative features. Wrists/elbows/fingers are measured from the
// shoulder centre in "body units", so camera distance and position matter less.
function prep(frames,ar){
  const F=[];let ref=null,okCount=0;
  for(const f of frames){
    const o={t:f.t,ok:false,pts:null,trunk:null};
    if(f.p){
      const P=k=>({x:f.p[k*3]/1000*ar,y:f.p[k*3+1]/1000,v:f.p[k*3+2]/100});
      const ls=P(K.ls),rs=P(K.rs);
      if(ls.v>.3&&rs.v>.3){
        const lh=P(K.lh),rh=P(K.rh),hipOk=lh.v>.3&&rh.v>.3;
        const ms={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2},mh={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2};
        const sc=Math.max(hipOk?hyp(ms,mh):0,hyp(ls,rs)*1.25,0.02);
        if(!ref)ref={x:ms.x,y:ms.y,sc};
        o.pts=[K.lw,K.rw,K.le,K.re,K.li,K.ri].map(k=>{const q=P(k);return{x:(q.x-ms.x)/sc,y:(q.y-ms.y)/sc,v:q.v}});
        o.pts.push({x:(ms.x-ref.x)/ref.sc*0.7,y:(ms.y-ref.y)/ref.sc*0.7,v:1});
        o.trunk=hipOk?Math.atan2(Math.abs(ms.x-mh.x),mh.y-ms.y)*180/Math.PI:null;
        o.ok=true;okCount++;
      }
    }
    F.push(o);
  }
  let last=null;
  for(const o of F){if(o.ok)last=o;else if(last){o.pts=last.pts.map(p=>({x:p.x,y:p.y,v:p.v*.5}));o.trunk=last.trunk}}
  let nxt=null;
  for(let i=F.length-1;i>=0;i--){const o=F[i];if(o.ok)nxt=o;else if(!o.pts&&nxt){o.pts=nxt.pts.map(p=>({x:p.x,y:p.y,v:p.v*.5}));o.trunk=nxt.trunk}}
  // light smoothing (3-frame average)
  const S=F.map((o,i)=>{if(!o.pts)return o;const a=F[i-1]&&F[i-1].pts?F[i-1]:o,b=F[i+1]&&F[i+1].pts?F[i+1]:o;
    return{...o,pts:o.pts.map((p,k)=>({x:(a.pts[k].x+p.x+b.pts[k].x)/3,y:(a.pts[k].y+p.y+b.pts[k].y)/3,v:p.v}))}});
  S.okCount=okCount;return S;
}
// Hand + body speed (body units per second), smoothed over ~0.5 s
function speeds(F){
  const v=F.map((o,i)=>{if(i===0||!o.pts||!F[i-1].pts)return 0;const dt=Math.max(.01,(o.t-F[i-1].t)/1000);const p=F[i-1].pts;
    return(hyp(o.pts[0],p[0])+hyp(o.pts[1],p[1])+hyp(o.pts[6],p[6]))/dt});
  const out=new Array(F.length);let a=0,b=0,sum=0;
  for(let i=0;i<F.length;i++){while(b<F.length&&F[b].t<=F[i].t+250){sum+=v[b];b++}while(F[a].t<F[i].t-250){sum-=v[a];a++}out[i]=sum/Math.max(1,b-a)}
  return out;
}
function autoTrim(F){
  const v=speeds(F);const thr=Math.max(0.35,percentile(v,0.5)*0.4);
  let s=0,e=F.length-1;while(s<e&&v[s]<thr)s++;while(e>s&&v[e]<thr)e--;
  if(e-s<5)return[F[0].t,F[F.length-1].t];
  return[Math.max(F[0].t,F[s].t-300),Math.min(F[F.length-1].t,F[e].t+300)];
}
function percentile(arr,q){const a=arr.filter(x=>isFinite(x)).slice().sort((x,y)=>x-y);if(!a.length)return 0;return a[Math.min(a.length-1,Math.floor(q*a.length))]}
// Split a recording into elements at natural pauses / slow points of the hands
function autoSplit(F,t0,t1,level){
  const L={fewer:2500,normal:1200,more:700}[level]||1200;
  const idx=[];F.forEach((o,i)=>{if(o.t>=t0&&o.t<=t1)idx.push(i)});
  const v=speeds(F);const V=idx.map(i=>v[i]),T=idx.map(i=>F[i].t);
  const thr=percentile(V,0.4);const cand=[];
  for(let k=1;k<V.length-1;k++){if(V[k]<=V[k-1]&&V[k]<=V[k+1]&&V[k]<=thr)cand.push(k)}
  cand.sort((a,b)=>V[a]-V[b]);const chosen=[];
  for(const k of cand){const t=T[k];if(t-t0<L*.6||t1-t<L*.6)continue;if(chosen.every(x=>Math.abs(x-t)>=L))chosen.push(t);if(chosen.length>=40)break}
  chosen.sort((a,b)=>a-b);return[t0,...chosen,t1];
}
function resample(F,rate){
  const out=[];const end=F[F.length-1].t;let p=0;
  for(let t=F[0].t;t<=end+1;t+=1000/rate){while(p<F.length-1&&Math.abs(F[p+1].t-t)<=Math.abs(F[p].t-t))p++;out.push({t,pts:F[p].pts,trunk:F[p].trunk})}
  return out;
}
const PW=[1.5,1.5,.8,.8,1,1,.8];
function fdist(a,b){let s=0,w=0;for(let k=0;k<7;k++){const pa=a.pts[k],pb=b.pts[k];const wk=Math.min(pa.v,pb.v)*PW[k];if(wk<.05)continue;s+=wk*hyp(pa,pb);w+=wk}return w?s/w:.5}
// Dynamic time warping: lines up the employee's motion with the expert's, frame by frame
function dtw(A,B){
  const n=A.length,m=B.length,dir=new Uint8Array(n*m);let prev=new Float64Array(m),cur=new Float64Array(m);
  for(let i=0;i<n;i++){
    for(let j=0;j<m;j++){
      const d=fdist(A[i],B[j]);
      if(i===0&&j===0){cur[j]=d;continue}
      let best=Infinity,dd=0;
      if(i>0&&j>0&&prev[j-1]+d<best){best=prev[j-1]+d;dd=1}
      if(i>0&&prev[j]+d+.02<best){best=prev[j]+d+.02;dd=2}
      if(j>0&&cur[j-1]+d+.02<best){best=cur[j-1]+d+.02;dd=3}
      cur[j]=best;dir[i*m+j]=dd;
    }
    const t=prev;prev=cur;cur=t;
  }
  const path=[];let i=n-1,j=m-1;
  while(i>0||j>0){path.push([i,j]);const d=dir[i*m+j];if(d===1){i--;j--}else if(d===2)i--;else j--}

}
function pathLen(R,a,b,k){let s=0;for(let i=a+1;i<=b;i++)s+=hyp(R[i].pts[k],R[i-1].pts[k]);return s}
function meanPt(R,a,b,k){let x=0,y=0,w=0;for(let i=a;i<=b;i++){const p=R[i].pts[k];x+=p.x*p.v;y+=p.y*p.v;w+=p.v}return w?{x:x/w,y:y/w}:null}

// farthest wrist from the expert's position (body units); used to decide if a step's end position was reached
function handDist(a,b){let d=0;for(const k of[0,1]){const pa=a.pts[k],pb=b.pts[k];if(Math.min(pa.v,pb.v)<.3)continue;d=Math.max(d,hyp(pa,pb))}return d}

function analyze(std,att,sensKey){
  const C=SENS[sensKey]||SENS.normal,missThr=C*1.2;
  const PS=prep(std.frames,std.ar),PA=prep(att.frames,att.ar);
  if(PS.okCount<5)throw new Error("The standard has too few frames with a person.");
  if(PA.okCount<5)throw new Error("No person was detected in this attempt. Check the camera position.");
  const dS=Math.max(1,PS[PS.length-1].t-PS[0].t)/1000,dA=Math.max(1,PA[PA.length-1].t-PA[0].t)/1000;
  const rate=clamp(Math.sqrt(2.5e6/(Math.max(dS,1)*Math.max(dA,1))),3,10);
  const RS=resample(PS,rate),RA=resample(PA,rate);const n=RS.length,m=RA.length;
  // 1. whole-cycle alignment
  const path=dtw(RS,RA);const jmax=new Int32Array(n).fill(-1),jmin=new Int32Array(n).fill(m);
  for(const[i,j]of path){if(j>jmax[i])jmax[i]=j;if(j<jmin[i])jmin[i]=j}
  const els=std.elements,KN=els.length,t0=PS[0].t;
  const iStart=els.map((e,k)=>{if(k===0)return 0;let i=0;while(i<n-1&&RS[i].t-t0<e.start)i++;return i});
  const iEnd=els.map((e,k)=>k<KN-1?Math.max(iStart[k],iStart[k+1]-1):n-1);
  const sub=(R,a,b)=>R.slice(a,b+1);
  // 2. was each step's end position reached? anchor step ends on it
  const reached=[],anchor=[],keyMin=[];let prev=0;
  for(let k=0;k<KN;k++){
    const jc=jmax[iEnd[k]],w=Math.round(Math.max(1.2,0.6*(els[k].end-els[k].start)/1000)*rate);
    const cap=k<KN-1?Math.max(jc,(jc+jmax[iEnd[k+1]])>>1):m-1;
    const lo=Math.max(prev,jc-w),hi=Math.min(m-1,jc+w,cap),ds=[];let best=Infinity,bj=-1;
    for(let j=lo;j<=hi;j++){const d=handDist(RS[iEnd[k]],RA[j]);ds.push(d);if(d<best)best=d}
    // among frames that reach the position, take the one closest to the aligned time (keeps timing inside holds)
    for(let j=lo;j<=hi;j++){if(ds[j-lo]<=best+0.06&&(bj<0||Math.abs(j-jc)<Math.abs(bj-jc)))bj=j}
    keyMin[k]=best;reached[k]=bj>=0&&best<=missThr;
    if(k===KN-1){anchor[k]=m-1;reached[k]=reached[k]||bj>=0&&best<=missThr}
    else anchor[k]=reached[k]?bj:-1;
    if(reached[k])prev=anchor[k];
  }
  // 3. boundaries; runs of unreached steps are tested: skipped, or done differently?
  const segA=new Array(KN),segB=new Array(KN),skipped=new Array(KN).fill(false);let P=0,k=0;
  while(k<KN){
    if(reached[k]){segA[k]=P;segB[k]=anchor[k]+1;P=segB[k];k++;continue}
    let r2=k;while(r2<KN&&!reached[r2])r2++;
    const nxt=r2<KN?r2:-1,Q=nxt>=0?anchor[nxt]:m-1;
    let skip=false;
    if(nxt>=0&&Q>P){const att=sub(RA,P,Q),withRun=sub(RS,iStart[k],iEnd[nxt]),noRun=sub(RS,iStart[nxt],iEnd[nxt]);
      const cA=meanCost(withRun,att,dtw(withRun,att)),cB=meanCost(noRun,att,dtw(noRun,att));skip=cB<cA*0.85}
    else if(nxt<0){const rem=(m-P)/rate,need=els.slice(k).reduce((s,e)=>s+(e.end-e.start),0)/1000;skip=rem<need*0.3}
    else skip=true;
    const last=nxt>=0?nxt:KN-1,endJ=nxt>=0?Q:m-1;
    if(skip){for(let x=k;x<=(nxt>=0?r2-1:KN-1);x++){segA[x]=P;segB[x]=P;skipped[x]=true}
      if(nxt>=0){segA[nxt]=P;segB[nxt]=Q+1;P=Q+1;k=nxt+1}else{if(P<m&&KN>0){const lk=k-1>=0?k-1:0;if(segB[lk]!=null)segB[lk]=m}k=KN}}
    else{let p2=P;for(let x=k;x<=last;x++){const e=x===last?endJ+1:clamp(jmin[iStart[x+1]],p2,endJ+1);segA[x]=p2;segB[x]=e;p2=e}P=endJ+1;k=last+1}
  }
  if(KN&&segB[KN-1]<m&&!skipped[KN-1])segB[KN-1]=m;
  // 4. per-step comparison
  const amap=new Int32Array(m).fill(-1);
  const aSpeed=j=>j>0?(hyp(RA[j].pts[0],RA[j-1].pts[0])+hyp(RA[j].pts[1],RA[j-1].pts[1]))*rate:0;
  const elements=els.map((e,k)=>{
    const stdT=(e.end-e.start)/1000,aA=segA[k],aB=segB[k],aN=Math.max(0,aB-aA),actT=aN/rate,sA=iStart[k],sB=iEnd[k];
    let score=0,pause=0,extra=0;
    if(aN>0){const S1=sub(RS,sA,sB),A1=sub(RA,aA,aB-1),pth=dtw(S1,A1);score=Math.round(100*Math.exp(-Math.pow(meanCost(S1,A1,pth)/C,2)));
      let run=0,r0=0;const flush=()=>{if(run>=0.6*rate){let s=0;for(let j=r0;j<r0+run;j++)s+=aSpeed(aA+j);if(s/run>0.6)extra+=run/rate;else pause+=run/rate}run=0};
      pth.forEach(([i,j],c)=>{amap[aA+j]=sA+i;if(c>0&&pth[c-1][0]===i&&pth[c-1][1]===j-1){if(run===0)r0=j;run++}else flush()});flush()}
    const notes=[];let status="ok";
    if(skipped[k]||aN===0||(aN/Math.max(1,sB-sA+1)<0.35&&score<60))status="missed";
    else if(!reached[k]||score<55)status="method";
    else if(actT>stdT*1.25&&actT-stdT>0.5)status="slow";
    else if(actT<stdT*0.7&&stdT-actT>0.5)status="fast";
    if(status!=="missed"&&aN>1){
      for(const[h,name]of[[0,"Left"],[1,"Right"]]){
        const ls=pathLen(RS,sA,sB,h),la=pathLen(RA,aA,aB-1,h);
        if(ls>0.6&&la<ls*0.35)notes.push({kind:"hand",text:name+" hand is mostly idle here; the expert uses it ("+Math.round(la/ls*100)+"% of the expert's hand movement)."});
        const ms=meanPt(RS,sA,sB,h),ma=meanPt(RA,aA,aB-1,h);
        if(ms&&ma){const dx=ma.x-ms.x,dy=ma.y-ms.y,dd=Math.hypot(dx,dy);if(dd>0.35)notes.push({kind:"reach",text:name+" hand works "+dirWords(dx,dy)+" than the expert (≈"+Math.round(dd*CM_PER_UNIT)+" cm off)."})}
      }
      const ts=pathLen(RS,sA,sB,0)+pathLen(RS,sA,sB,1),ta=pathLen(RA,aA,aB-1,0)+pathLen(RA,aA,aB-1,1);
      if(ts>0.5&&ta>ts*1.4)notes.push({kind:"travel",text:"Hands travel "+Math.round((ta/ts-1)*100)+"% more distance than the expert (extra or searching movements)."});
      const trS=meanTrunk(RS,sA,sB),trA=meanTrunk(RA,aA,aB-1);
      if(trS!=null&&trA!=null&&trA-trS>15)notes.push({kind:"bend",text:"Bends "+Math.round(trA-trS)+"° more than the expert (ergonomic risk, slower)."});
      if(!reached[k])notes.unshift({kind:"pose",text:"The expert's end position for this step is never reached."});
      if(k>0&&(skipped[k-1]))notes.unshift({kind:"after",text:"Starts from a different position because the previous step was missed."});
    }
    if(pause>0.5)notes.push({kind:"pause",text:"Pauses/hesitates about "+pause.toFixed(1)+" s."});
    if(extra>0.5)notes.push({kind:"extra",text:"About "+extra.toFixed(1)+" s of movement the expert does not make."});
    return{name:e.name,key:!!e.key,stdT,actT,score,status,notes,aStart:aA/rate,aEnd:aB/rate,sStart:e.start/1000,sEnd:e.end/1000};
  });
  let lastI=0;for(let j=0;j<m;j++){if(amap[j]<0)amap[j]=lastI;else lastI=amap[j]}
  const stdTotal=elements.reduce((s,e)=>s+e.stdT,0),actTotal=m/rate;
  const basic=stdTotal*(std.rating||100)/100;
  const match=Math.round(elements.reduce((s,e)=>s+e.score*e.stdT,0)/Math.max(.001,stdTotal));
  const missed=elements.filter(e=>e.status==="missed").length;
  const imp=[];
  elements.forEach((e,k)=>{
    const lost=e.actT-e.stdT;
    if(e.status==="missed")imp.push({k,sev:e.key?0:1,status:"missed",lost:0,title:(e.key?"Key step missed: ":"Step missed: ")+e.name,detail:"This step was not seen. Check whether it was skipped or done outside the camera view, then retrain it."+(e.key?" It is marked as a key point, so this is a quality risk.":"")});
    else if(e.status==="method")imp.push({k,sev:2,status:"method",lost:Math.max(0,lost),title:"Different method: "+e.name,detail:(e.notes.length?e.notes.map(x=>x.text).join(" "):"Hand positions and path differ from the expert.")+" Watch this step in the replay and retrain the method."});
    else if(e.status==="slow")imp.push({k,sev:3,status:"slow",lost,title:"Slow: "+e.name,detail:"Takes "+lost.toFixed(1)+" s longer ("+Math.round(e.actT/e.stdT*100)+"% of standard time). "+(e.notes.length?e.notes.map(x=>x.text).join(" "):"Same method, slower pace. Practise, and check material position.")});
    else if(e.status==="fast"&&e.score<75)imp.push({k,sev:4,status:"fast",lost:0,title:"Rushed: "+e.name,detail:"Much faster than the expert with a different motion ("+e.score+"% match). Check that no quality step is skipped."});

  });

  return{rate,amap:Array.from(amap),elements,improvements:imp,summary:{stdTotal,actTotal,basic,perf:Math.round(basic/Math.max(.1,actTotal)*100),match,missed,lost:Math.max(0,actTotal-stdTotal),sens:sensKey}};
}

const FileStore={dir:"motionstudy",
  folder(s,stdId){return this.dir+"/"+s+(s==="attempts"?"/"+stdId:"")},
  async list(path){try{const r=await FS.readdir({path,directory:"DATA"});return r.files.map(f=>typeof f==="string"?{name:f,type:"file"}:f)}catch(e){return[]}},
  async readJson(path){try{const d=await FS.readFile({path,directory:"DATA",encoding:"utf8"});return JSON.parse(d.data)}catch(e){return null}},
  async all(s,stdId){
    if(s==="attempts"&&!stdId){const out=[];for(const d of await this.list(this.dir+"/attempts"))if(d.type==="directory")out.push(...await this.all("attempts",d.name));return out}
    const p=this.folder(s,stdId),out=[];for(const f of await this.list(p)){if(!f.name.endsWith(".json"))continue;const j=await this.readJson(p+"/"+f.name);if(j)out.push(j)}return out},
  async put(s,v){await FS.writeFile({path:this.folder(s,v.stdId)+"/"+v.id+".json",data:JSON.stringify(v),directory:"DATA",encoding:"utf8",recursive:true})},
  async del(s,id,stdId){try{await FS.deleteFile({path:this.folder(s,stdId)+"/"+id+".json",directory:"DATA"})}catch(e){}}
};
const Store={db:null,mem:{standards:new Map(),attempts:new Map()},
  open(){return new Promise(res=>{try{const r=indexedDB.open("motion-standard",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("standards",{keyPath:"id"});d.createObjectStore("attempts",{keyPath:"id"}).createIndex("std","stdId")};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  req(store,mode,fn){if(!this.db)return Promise.resolve(fn(null));return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error)})},
  async migrate(){ // copy anything saved earlier in the browser database into files (runs once)
    if(!FS||!this.db)return;let done=false;try{done=localStorage.getItem("ms.migrated")==="1"}catch(e){}if(done)return;
    for(const s of["standards","attempts"]){let rows=[];try{rows=await this.req(s,"readonly",o=>o.getAll())}catch(e){}for(const v of rows||[])try{await FileStore.put(s,v)}catch(e){}}
    try{localStorage.setItem("ms.migrated","1")}catch(e){}},
  all(s){if(FS)return FileStore.all(s);return this.db?this.req(s,"readonly",o=>o.getAll()):Promise.resolve([...this.mem[s].values()])},
  get(s,id){return this.db?this.req(s,"readonly",o=>o.get(id)):Promise.resolve(this.mem[s].get(id))},
  put(s,v){if(FS)return FileStore.put(s,v);if(!this.db){this.mem[s].set(v.id,v);return Promise.resolve()}return this.req(s,"readwrite",o=>o.put(v))},
  del(s,id,stdId){if(FS)return FileStore.del(s,id,stdId);if(!this.db){this.mem[s].delete(id);return Promise.resolve()}return this.req(s,"readwrite",o=>o.delete(id))},
  async byStd(id){if(FS)return FileStore.all("attempts",id);return(await this.all("attempts")).filter(a=>a.stdId===id)}
};

async function mountRecord(){

  if(!window.isSecureContext||!navigator.mediaDevices){recMsg(NATIVE?"This phone's browser engine has no camera support. Update Android System WebView from the Play Store.":"The camera only works when this page is opened from an https:// address.");}
  Pose.load().then(()=>{readyCheck();if(!R.stream&&R.src==="camera")recMsg("Opening camera…")}).catch(()=>recMsg(NATIVE?"Couldn't start the body-tracking model on this phone. Close the app and open it again.":"Couldn't load the body-tracking model. Check the internet connection, then go back and open this screen again."));
  if(R.src==="camera"&&navigator.mediaDevices){try{await openCam();readyCheck();keepAwake()}catch(e){recMsg(e&&e.name==="NotAllowedError"?(NATIVE?"Camera permission was refused. Open Android Settings → Apps → Motion Study → Permissions → Camera → Allow, then come back.":"Camera permission was refused. Allow the camera for this site in the browser settings, then reload."):"Couldn't open the camera: "+(e.message||e))}}

function stopRecordView(){cancelAnimationFrame(R.raf);R.recording=false;R.counting=false;if(R.stream){R.stream.getTracks().forEach(t=>t.stop());R.stream=null}const v=$("#rv");if(v){try{v.pause()}catch(e){}}}
const curT=()=>R.src==="file"?$("#rv").currentTime*1000:performance.now()-R.t0;
function recLoop(){
  if(S.view!=="record")return;R.raf=requestAnimationFrame(recLoop);
  const v=$("#rv");if(!v||!Pose.lm||v.readyState<2)return;
  const now=performance.now();if(now-R.lastDet<60)return;if(v.currentTime===R.lastVT)return;
  R.lastVT=v.currentTime;R.lastDet=now;
  const lm=Pose.detect(v);const c=$("#rc"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
  if(R.mode==="attempt"&&!R.recording&&R.std){const f0=R.std.frames.find(f=>f.p);if(f0)drawSkel(ctx,absPts(f0.p,c.width,c.height),"#f2f5f4",{width:Math.max(3,c.width/220),dash:[10,8],alpha:.7,joints:false})}
  if(lm)drawSkel(ctx,absPts(encode(lm),c.width,c.height),R.recording?"#ff7b6b":"#4db2ab",{width:Math.max(3,c.width/160)});
  if(R.recording){
    const t=curT();R.frames.push({t:Math.round(t),p:lm?encode(lm):null});
    $("#hudR").textContent=fmtClock(t);
    if(R.mode==="attempt"){const p=$("#pbar");if(p){const r=t/R.std.duration;p.style.width=Math.min(100,r*100)+"%";p.classList.toggle("over",r>1)}
      if(R.autoStop&&R.src==="camera"&&t>Math.max(4000,R.std.duration*.5)&&stillFor(3000))finishRec()}
  }else $("#hudL").textContent=lm?"Person found":"No person in view";
}
function stillFor(ms){const fr=R.frames;if(!fr.length)return false;const end=fr[fr.length-1].t;if(end-fr[0].t<ms)return false;
  const seg=fr.filter(f=>f.t>=end-ms);if(seg.length<5)return false;const P=prep(seg,R.ar);const v=speeds(P);return v.reduce((a,b)=>a+b,0)/v.length<0.25}
ACT.recToggle=async()=>{
  if(R.recording){finishRec();return}if(R.counting)return;
  beep(660,.01);keepAwake();
  if(R.src==="camera"&&R.cd>0){R.counting=true;const c=$("#count");c.hidden=false;$("#recBtn").textContent="Cancel";
    for(let s=R.cd;s>0;s--){if(!R.counting||S.view!=="record"){c.hidden=true;$("#recBtn").textContent="Start recording";return}c.textContent=s;beep(s<=3?880:660,.08);await new Promise(r=>setTimeout(r,1000))}
    c.hidden=true;R.counting=false;}
  startRec();
};
async function startRec(){
  R.frames=[];R.marks=[];R.recording=true;beep(1320,.25);
  $("#recBtn").textContent="Stop";$("#recBtn").classList.add("stop");$("#hudL").textContent="Recording";$("#hudL").classList.add("rec");const mb=$("#markBtn");if(mb)mb.disabled=false;
  if(R.src==="file"){const v=$("#rv");v.currentTime=0;v.onended=()=>finishRec();try{await v.play()}catch(e){toast("Couldn't play the video.");R.recording=false}}
  else R.t0=performance.now();
}
function finishRec(){
  if(!R.recording)return;R.recording=false;beep(440,.3);const v=$("#rv");if(R.src==="file")try{v.pause()}catch(e){}
  const withPerson=R.frames.filter(f=>f.p).length;
  if(withPerson<10){toast("No person was detected. Check the camera view and try again.");render();return}
  const rec={frames:R.frames.slice(),marks:R.marks.slice(),ar:R.ar};
  if(R.mode==="standard"){E.init(rec,null);go("edit")}else{RV.init(rec,R.std);go("review")}
}

/* ===== Shared player ===== */
class Player{
  constructor(root,dur,draw,onTime){this.root=root;this.dur=Math.max(1,dur);this.draw=draw;this.onTime=onTime;this.t=0;this.playing=false;this.speed=1;
    this.cv=root.querySelector("canvas");this.rng=root.querySelector("input[type=range]");this.btn=root.querySelector("[data-pl=play]");this.tm=root.querySelector(".time");this.sp=root.querySelector("[data-pl=speed]");
    this.rng.max=this.dur;this.rng.addEventListener("input",()=>{this.pause();this.seek(+this.rng.value)});this.btn.addEventListener("click",()=>this.toggle());
    if(this.sp)this.sp.addEventListener("change",()=>{this.speed=+this.sp.value});
    this.ro=new ResizeObserver(()=>this.seek(this.t));this.ro.observe(this.cv)}
  seek(t){this.t=clamp(t,0,this.dur);this.rng.value=this.t;this.tm.textContent=fmtClock(this.t)+" / "+fmtClock(this.dur);this.draw(this.cv,this.t);if(this.onTime)this.onTime(this.t)}

async function hashPw(pw,saltHex){const salt=saltHex?new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));

  <div class="field"><label class="lbl" for="lgPw">Password</label><input type="password" id="lgPw" autocomplete="${first?"new-password":"current-password"}" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)"></div>
  ${first?`<div class="field"><label class="lbl" for="lgPw2">Repeat password</label><input type="password" id="lgPw2" autocomplete="new-password" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)"></div>`
   :`<label class="check"><input type="checkbox" id="lgStay"> Stay signed in on this phone</label>`}
  <p class="note" id="lgErr" style="color:var(--miss)">${esc(L.err)}</p>
  <button class="btn primary big" data-act="${first?"createAdmin":"login"}">${first?"Create account":"Sign in"}</button>
  ${NATIVE?`<button class="btn" data-act="exitAsk">Exit app</button>`:""}</section>`}
function lgErr(m){L.err=m;const e=$("#lgErr");if(e)e.textContent=m}
ACT.createAdmin=async()=>{const name=$("#lgName").value.trim(),uid=$("#lgId").value.trim().toLowerCase(),pw=$("#lgPw").value,pw2=$("#lgPw2").value;
  if(!name||!uid)return lgErr("Enter your name and a user ID.");if(!/^[a-z0-9._-]{3,30}$/.test(uid))return lgErr("User ID: 3–30 letters, numbers, dot, dash or underscore. No spaces.");
  if(pw.length<6)return lgErr("Password must be at least 6 characters.");if(pw!==pw2)return lgErr("The two passwords are different.");
  const h=await hashPw(pw);const u={id:uid,uid,name,role:"admin",active:true,salt:h.salt,hash:h.hash,created:Date.now()};Users.list.push(u);
  try{await Users.save()}catch(e){Users.list=[];return lgErr("Couldn't save the account: "+(e.message||e))}
  signIn(u,false);toast("Admin account created. Welcome, "+name+".")};
ACT.login=async()=>{const uid=$("#lgId").value,pw=$("#lgPw").value,stay=$("#lgStay").checked;const u=Users.find(uid);
  if(!u||!(await checkPw(u,pw)))return lgErr("User ID or password is wrong.");if(u.active===false)return lgErr("This account is switched off. Ask the admin.");
  signIn(u,stay)};
function signIn(u,stay){S.user={id:u.id,name:u.name,role:u.role};L.err="";try{stay?localStorage.setItem("ms.session",u.id):localStorage.removeItem("ms.session")}catch(e){}renderUserbar();go("library")}
ACT.logout=async()=>{closeMenu();if(S.view==="jbs")await jbsFlush();if(S.view==="record")stopRecordView();S.user=null;try{localStorage.removeItem("ms.session")}catch(e){}renderUserbar();S.view="login";render()};
function renderUserbar(){const b=$("#userbar");if(!b)return;b.innerHTML=S.user?`<button class="uchip" data-act="openMenu" aria-haspopup="menu">${esc(S.user.name)} <i>${ROLES[S.user.role].l}</i> ☰</button>`:`<div class="privacy">Video stays on this phone. Only body-point coordinates are saved.</div>`}
ACT.openMenu=()=>{const m=$("#menu");m.innerHTML=`<div class="box" role="menu"><div class="who">Signed in as <b>${esc(S.user.name)}</b> (${ROLES[S.user.role].l})</div>
  <button role="menuitem" data-act="menuGo" data-v="library">Standards</button>
  ${can("users")?`<button role="menuitem" data-act="menuGo" data-v="users">Users</button>`:""}
  <button role="menuitem" data-act="menuGo" data-v="password">Change password</button>
  <button role="menuitem" data-act="logout">Log out</button>
  ${NATIVE?`<button role="menuitem" data-act="exitAsk" style="color:var(--miss)">Exit app</button>`:""}</div>`;m.hidden=false};
function closeMenu(){const m=$("#menu");if(m)m.hidden=true}
document.addEventListener("click",e=>{const m=$("#menu");if(m&&!m.hidden&&e.target===m)closeMenu()});
ACT.menuGo=d=>{closeMenu();go(d.v)};
ACT.exitAsk=()=>{closeMenu();const m=$("#modal");m.innerHTML=`<div class="box" role="dialog" aria-labelledby="exT"><h2 id="exT">Exit Motion Study?</h2><p class="note">Your standards and checks are saved on this phone.</p>
  <div class="row"><button class="btn primary" data-act="exitApp" style="flex:1">Exit</button><button class="btn" data-act="exitCancel" style="flex:1">Cancel</button></div></div>`;m.hidden=false};
ACT.exitCancel=()=>{$("#modal").hidden=true};
ACT.exitApp=async()=>{$("#modal").hidden=true;try{if(S.view==="jbs")await jbsFlush();if(S.view==="record")stopRecordView()}catch(e){}
  try{if(!localStorage.getItem("ms.session")){S.user=null}}catch(e){}
  if(NP.App&&NP.App.exitApp)NP.App.exitApp();else toast("Close the app from the phone's recent apps screen.")};
// Users screen (admin)
const UF={id:"",name:"",uid:"",role:"engineer",pw:""};
function vUsers(){if(!can("users"))return`<p class="note">Only the admin can manage users.</p>`;
  return`<div class="row"><button class="link" data-act="home">← Standards</button></div><div><h1>Users</h1><p class="lead">People who can sign in on this phone. Give each person their own user ID so the app records who made each standard and check.</p></div>
  <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>User ID</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
  ${Users.list.map(u=>`<tr><td>${esc(u.name)}</td><td class="num">${esc(u.uid)}</td><td><span class="role ${u.role==="admin"?"admin":""}">${ROLES[u.role].l}</span></td><td>${u.active===false?"Off":"Active"}</td>
   <td><div class="row"><button class="link" data-act="uEdit" data-id="${esc(u.id)}">Edit</button>${u.id!==S.user.id?`<button class="link" data-act="uToggle" data-id="${esc(u.id)}">${u.active===false?"Switch on":"Switch off"}</button>`:""}</div></td></tr>`).join("")}
  </tbody></table></div></section>
  <section class="panel"><h2>${UF.id?"Edit user":"Add a user"}</h2><div class="grid">
  <div class="field"><label class="lbl" for="ufName">Full name</label><input type="text" id="ufName" value="${esc(UF.name)}" data-input="uf" data-f="name"></div>
  <div class="field"><label class="lbl" for="ufUid">User ID</label><input type="text" id="ufUid" value="${esc(UF.uid)}" data-input="uf" data-f="uid" autocapitalize="none" spellcheck="false"${UF.id?" disabled":""}></div>
  <div class="field"><label class="lbl" for="ufRole">Role</label><select id="ufRole" data-change="ufRole">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${UF.role===k?" selected":""}>${v.l}</option>`).join("")}</select></div>
  <div class="field"><label class="lbl" for="ufPw">${UF.id?"New password (leave empty to keep)":"Password"}</label><input type="text" id="ufPw" value="${esc(UF.pw)}" data-input="uf" data-f="pw" autocomplete="off"></div></div>
  <p class="note">${Object.values(ROLES).map(r=>"<b>"+r.l+"</b>: "+r.d).join(" · ")}</p>
  <div class="row"><button class="btn primary" data-act="uSave">${UF.id?"Save changes":"Add user"}</button>${UF.id?`<button class="btn" data-act="uClear">Cancel</button>`:""}</div></section>
  <p class="note">Tell each person their user ID and password. They can change the password from the menu. If someone forgets theirs, edit the user here and set a new one. Keep at least two admin accounts so the phone is never locked out.</p>`}
ACT.uf=(d,el)=>{UF[d.f]=el.value};ACT.ufRole=(d,el)=>{UF.role=el.value};
ACT.uEdit=d=>{const u=Users.list.find(x=>x.id===d.id);Object.assign(UF,{id:u.id,name:u.name,uid:u.uid,role:u.role,pw:""});render()};
ACT.uClear=()=>{Object.assign(UF,{id:"",name:"",uid:"",role:"engineer",pw:""});render()};
ACT.uToggle=async d=>{const u=Users.list.find(x=>x.id===d.id);u.active=u.active===false;await Users.save();render()};
ACT.uSave=async()=>{const name=UF.name.trim(),uid=UF.uid.trim().toLowerCase();
  if(!name)return toast("Enter the person's name.");
  if(UF.id){const u=Users.list.find(x=>x.id===UF.id);
    if(u.role==="admin"&&UF.role!=="admin"&&Users.list.filter(x=>x.role==="admin"&&x.active!==false).length<2)return toast("Keep at least one active admin.");
    u.name=name;u.role=UF.role;if(UF.pw){if(UF.pw.length<6)return toast("Password must be at least 6 characters.");const h=await hashPw(UF.pw);u.salt=h.salt;u.hash=h.hash}
    if(u.id===S.user.id){S.user.name=u.name;S.user.role=u.role;renderUserbar()}}
  else{if(!/^[a-z0-9._-]{3,30}$/.test(uid))return toast("User ID: 3–30 letters, numbers, dot, dash or underscore.");if(Users.find(uid))return toast("That user ID is already taken.");
    if(UF.pw.length<6)return toast("Password must be at least 6 characters.");const h=await hashPw(UF.pw);
    Users.list.push({id:uid,uid,name,role:UF.role,active:true,salt:h.salt,hash:h.hash,created:Date.now()})}
  try{await Users.save()}catch(e){return toast("Couldn't save: "+(e.message||e))}toast(UF.id?"Saved":"User added");ACT.uClear()};
// Change own password
function vPassword(){return`<div class="row"><button class="link" data-act="home">← Standards</button></div><section class="panel login"><h1>Change password</h1>
  <div class="field"><label class="lbl" for="cpOld">Current password</label><input type="password" id="cpOld" autocomplete="current-password" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)"></div>
  <div class="field"><label class="lbl" for="cpNew">New password</label><input type="password" id="cpNew" autocomplete="new-password" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)"></div>
  <div class="field"><label class="lbl" for="cpNew2">Repeat new password</label><input type="password" id="cpNew2" autocomplete="new-password" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)"></div>
  <button class="btn primary big" data-act="cpSave">Change password</button></section>`}
ACT.cpSave=async()=>{const u=Users.list.find(x=>x.id===S.user.id);const o=$("#cpOld").value,n=$("#cpNew").value,n2=$("#cpNew2").value;
  if(!u||!(await checkPw(u,o)))return toast("The current password is wrong.");if(n.length<6)return toast("New password must be at least 6 characters.");if(n!==n2)return toast("The new passwords are different.");
  const h=await hashPw(n);u.salt=h.salt;u.hash=h.hash;await Users.save();toast("Password changed");go("library")};
// Android back button
function backTarget(){const v=S.view;
  if(v==="std"||v==="users"||v==="password")return"library";
  if(v==="jbs"||v==="review"||v==="result")return"std";
  if(v==="record")return R.mode==="attempt"?"std":"library";
  if(v==="edit")return E.base?"std":"library";
  return null}
function onBack(){if(!$("#modal").hidden){$("#modal").hidden=true;return}if(!$("#menu").hidden){closeMenu();return}
  if(!S.user||S.view==="library"||S.view==="login"){ACT.exitAsk();return}
  const t=backTarget();if(t)go(t);else ACT.exitAsk()}

/* ===== Boot ===== */
(async()=>{
  app.innerHTML=`<section class="panel"><p class="note">Loading…</p></section>`;
  await Store.open();await Store.migrate();
  try{if(!NATIVE&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{const r=await fetch("standards.json",{cache:"no-store"});if(r.ok){const j=await r.json();(j.standards||[]).forEach(s=>{if(s&&s.id&&Array.isArray(s.frames))S.factory.set(s.id,s)})}}catch(e){}
  await Users.load();
  let sid=null;try{sid=localStorage.getItem("ms.session")}catch(e){}
  const su=sid&&Users.list.find(u=>u.id===sid&&u.active!==false);
  if(su)S.user={id:su.id,name:su.name,role:su.role};
  S.view=S.user?"library":"login";renderUserbar();
  if(NATIVE&&NP.App&&NP.App.addListener)try{NP.App.addListener("backButton",onBack)}catch(e){}
  await loadStds();render();
  Pose.load().catch(()=>{});
})();
</script>
</body>
</html>
